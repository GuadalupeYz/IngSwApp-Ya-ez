# Deploy completo del trabajo final en Docker:
#   app            -> la app JHipster (imagen generada con Jib)         http://localhost:8080
#   postgresql     -> base de datos de producción
#   elasticsearch  -> guarda e indexa los logs                         http://localhost:9200
#   logstash       -> recibe los logs de la app por TCP, filtra y enmascara
#   kibana         -> búsqueda, dashboards y alertas sobre los logs    http://localhost:5601
#
# La app manda sus logs en JSON a logstash:5000 por la red interna de Docker.
# Configurado para una computadora de desarrollo (poca memoria, sin seguridad en Elastic).
name: blog

services:
  app:
    # Imagen local generada con: ./mvnw -Pprod -DskipTests verify jib:dockerBuild
    # (o la publicada en Docker Hub por Jenkins, pasando BLOG_IMAGE=usuario/blog:tag)
    image: ${BLOG_IMAGE:-blog:latest}
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      # secret-samples trae un secreto JWT de ejemplo: en producción real se pasa uno propio
      # con JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET
      - SPRING_PROFILES_ACTIVE=prod,api-docs,secret-samples
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/blog
      - SPRING_DATASOURCE_USERNAME=blog
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://postgresql:5432/blog
      # Envío de logs al stack ELK
      - JHIPSTER_LOGGING_LOGSTASH_ENABLED=true
      - JHIPSTER_LOGGING_LOGSTASH_HOST=logstash
      - JHIPSTER_LOGGING_LOGSTASH_PORT=5000
      # CORS: permite que la PWA (Ionic, puerto 8100) consuma la API
      - JHIPSTER_CORS_ALLOWED_ORIGINS=http://localhost:8100
      - JHIPSTER_CORS_ALLOWED_METHODS=*
      - JHIPSTER_CORS_ALLOWED_HEADERS=*
      - JHIPSTER_CORS_EXPOSED_HEADERS=Authorization,Link,X-Total-Count
      - JHIPSTER_CORS_ALLOW_CREDENTIALS=true
      - JHIPSTER_CORS_MAX_AGE=1800
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /management/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"\\\"status\\\":\\\"UP\\\"\" <&3'"
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      postgresql:
        condition: service_healthy
      # La app espera a que Logstash esté recibiendo, así no se pierden los logs del arranque
      logstash:
        condition: service_healthy

  postgresql:
    image: postgres:18.6
    environment:
      - POSTGRES_USER=blog
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:9.4.6
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # Sin esto, con el disco por encima del 85 % Elasticsearch deja los índices en solo lectura
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  logstash:
    image: logstash:9.4.6
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.monitoring.enabled=false
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      # Listo cuando el pipeline "main" está corriendo (API de monitoreo de Logstash)
      test: ["CMD-SHELL", "curl -s http://localhost:9600/_node/stats/pipelines/main | grep -q '\"main\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: kibana:9.4.6
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  pgdata: {}
  esdata: {}
